<body>
    <main>
        <h1>Loot Item System</h1>

        <form class="loot-form">
            <fieldset>
                <legend>Enter Loot Item</legend>                
                <label for="lootName">Loot:</label>
                <input type="text" placeholder="Loot Name" id="lootName" name ="lootName">
                <label for="lootValue">Value</label>
                <input type="number" placeholder="Loot Value" id="lootValue" name="lootValue">
                <input id="submitButton" type="submit" value="Add Loot">
            </fieldset>
        </form>       
    


        <section class="lootItems">
            <h2>Loot Items</h2>
            <ul id="itemsList">
                <!-- place holders for testing -->
                <li>black shoe</li>
                <li></li>
            </ul>
        </section>
        
        <section class="totalValue">
            <h2>Total value: </h2>
            <p id="totalValue">0</p>
        </section>

        <section class="message">
            <h2>Message:</h2>
            <p id="Message">No current message</p>
        </section>
    </main>
